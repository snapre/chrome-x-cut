<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Social Photo Saver</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        width: 352px;
        padding: 14px;
      }

      [hidden] {
        display: none !important;
      }

      h1 {
        font-size: 15px;
        line-height: 1.2;
        margin: 0 0 12px;
      }

      button,
      select,
      label {
        font: inherit;
      }

      .primary {
        align-items: center;
        background: #1d9bf0;
        border: 0;
        border-radius: 8px;
        color: #ffffff;
        cursor: pointer;
        display: flex;
        font-weight: 650;
        gap: 8px;
        justify-content: center;
        letter-spacing: 0;
        min-height: 40px;
        width: 100%;
      }

      .primary.is-queued {
        background: #166534;
      }

      .row {
        display: grid;
        gap: 6px;
        margin-top: 12px;
      }

      select {
        border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
        border-radius: 8px;
        min-height: 36px;
        padding: 0 10px;
      }

      .album-controls {
        display: grid;
        gap: 6px;
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .album-controls select {
        min-width: 0;
        width: 100%;
      }

      .secondary {
        background: color-mix(in srgb, CanvasText 8%, transparent);
        border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
        border-radius: 8px;
        cursor: pointer;
        min-height: 36px;
        padding: 0 10px;
      }

      .secondary[disabled] {
        cursor: progress;
        opacity: 0.6;
      }

      .field-hint {
        color: color-mix(in srgb, CanvasText 56%, transparent);
        font-size: 11px;
        line-height: 1.35;
      }

      .check {
        align-items: center;
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }

      .status {
        color: color-mix(in srgb, CanvasText 66%, transparent);
        font-size: 12px;
        line-height: 1.35;
        margin: 8px 0 0;
      }

      .status:empty {
        display: none;
      }

      .status.is-error, .history-error {
        color: light-dark(#9b261d, #f9a198);
      }

      .history-header {
        align-items: baseline;
        display: flex;
        gap: 8px;
        justify-content: space-between;
        margin: 16px 0 8px;
      }

      .history-header h2 {
        font-size: 13px;
        margin: 0;
      }

      .history-summary, .history-meta, .empty-history {
        color: color-mix(in srgb, CanvasText 65%, transparent);
        font-size: 11px;
        line-height: 1.45;
      }

      .history-list {
        list-style: none;
        margin: 0;
        max-height: 305px;
        overflow-y: auto;
        padding: 0;
      }

      .history-row {
        align-items: start;
        border-top: 1px solid color-mix(in srgb, CanvasText 12%, transparent);
        display: grid;
        gap: 9px;
        grid-template-columns: 40px minmax(0, 1fr);
        padding: 9px 0;
      }

      .preview {
        background: color-mix(in srgb, CanvasText 8%, Canvas);
        border-radius: 6px;
        display: grid;
        font-size: 8px;
        height: 40px;
        overflow: hidden;
        place-items: center;
        position: relative;
        width: 40px;
      }

      .preview img {
        height: 100%;
        inset: 0;
        object-fit: cover;
        position: absolute;
        width: 100%;
      }

      .history-title {
        align-items: baseline;
        display: flex;
        gap: 6px;
        justify-content: space-between;
        margin-bottom: 3px;
      }

      .history-filename {
        color: inherit;
        font-size: 12px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .history-state {
        flex: none;
        font-size: 11px;
        font-weight: 600;
        padding-right: 3px;
      }

      .history-state[data-state="success"] {
        color: light-dark(#137333, #87d59c);
      }

      .history-state[data-state="failed"], .history-state[data-state="uncertain"] {
        color: light-dark(#9b261d, #f9a198);
      }

      .history-error {
        font-size: 11px;
        line-height: 1.4;
        margin: 5px 0;
        overflow-wrap: anywhere;
      }

      .history-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }

      .retry {
        font-size: 11px;
        min-height: 26px;
        padding: 0 8px;
      }

      details {
        border-top: 1px solid color-mix(in srgb, CanvasText 14%, transparent);
        font-size: 12px;
        margin-top: 12px;
        padding-top: 10px;
      }

      summary {
        cursor: pointer;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>Social Photo Saver</h1>
    <button class="primary" id="save" type="button">
      <span id="saveIcon" aria-hidden="true">↓</span>
      <span id="saveLabel" aria-live="polite">保存当前原图</span>
    </button>

    <p class="status" id="status" role="status"></p>

    <section aria-labelledby="historyTitle">
      <div class="history-header">
        <h2 id="historyTitle">Cut 记录</h2>
        <span class="history-summary" id="historySummary" role="status"></span>
      </div>
      <p class="empty-history" id="emptyHistory">还没有 Cut 记录。</p>
      <ol class="history-list" id="history"></ol>
    </section>

    <details id="settings">
      <summary>保存设置</summary>
      <div class="row">
        <label for="mode">保存方式</label>
        <select id="mode">
          <option value="download">下载目录</option>
          <option value="photos">Photos app</option>
        </select>
      </div>

      <div class="row" id="albumRow">
        <label for="albumSelect">Photos 相册</label>
        <div class="album-controls">
          <select id="albumSelect" disabled>
            <option value="">Photos 图库（不指定相册）</option>
          </select>
          <button class="secondary" id="refreshAlbums" type="button">刷新</button>
        </div>
        <span class="field-hint" id="albumHint">正在读取 Photos 相册…</span>
      </div>

      <label class="check" id="keepFileRow">
        <input id="keepFile" type="checkbox">
        <span>导入 Photos 后保留本地文件</span>
      </label>

      <p class="field-hint">Photos app 需要安装本机助手。</p>
    </details>
    <script src="popup.js"></script>
  </body>
</html>
